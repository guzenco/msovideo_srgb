name: Build
run-name: Build v${{ github.event.inputs.version }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
        version:
          description: 'Build version'
          required: true
          default: '0.0.0'
  workflow_call:
    inputs:
        version:
          description: 'Build version'
          required: true
          type: string
          
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false
  
env:
  BUILD_NAME: msovideo_srgb-${{ github.event.inputs.version }}-win64
          
jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.2.0

      - name: Restore NuGet packages
        run: nuget restore msovideo_srgb.sln

      - name: Generate AssemblyInfo
        run: |
          Add-Content -Path "msovideo_srgb/Properties/AssemblyInfo.cs" -Value '[assembly: AssemblyVersion("${{ github.event.inputs.version }}")]'
          Add-Content -Path "msovideo_srgb/Properties/AssemblyInfo.cs" -Value '[assembly: AssemblyMetadata("Commit", "${{ github.sha }}")]'

      - name: Build solution
        run: msbuild msovideo_srgb.sln /p:Configuration=Release
      
      - name: Prepare build files
        run: |
          $path = "output"
          New-Item -ItemType Directory -Force -Path $path
          Copy-Item -Path "msovideo_srgb\bin\x64\Release\*.exe" -Destination $path -Force
          $dlls= "msovideo_srgb\bin\x64\Release\*.dll"
          if (Test-Path $dlls) {
            Copy-Item -Path $dlls -Destination $path -Force
          }
          Copy-Item -Path "LICENSE*" -Destination $path -Force

      - name: Create build archive
        run: |
          New-Item -ItemType Directory -Force -Path build
          Compress-Archive -Path "output\*" -DestinationPath "build\${{ env.BUILD_NAME }}.zip"

      - name: Attest build provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: build/*
          
      - name: Export attestation URL
        run: echo "attestation-url=${{ steps.attest.outputs.attestation-url }}" >> $GITHUB_OUTPUT
          
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Get-ChildItem build | ForEach-Object {
            gh attestation verify $_.FullName --repo ${{ github.repository }}
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
