name: Release
run-name: Release v${{ github.event.inputs.version }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
      notes:
        description: 'Release notes'
        required: true
      prerelease:
        description: 'Pre-release'
        required: true
        type: boolean
        default: true

concurrency:
  group: Release
  cancel-in-progress: false
  
env:
  RELEASE_NAME: v${{ github.event.inputs.version }}

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Validate version format
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version format incorrect"
            exit 1
          }
          Write-Host "Version format validated"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags

      - name: Validate tag uniqueness
        run: |
          $tag = "${{ env.RELEASE_NAME }}"
          git rev-parse -q --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Tag $tag already exists"
            exit 1
          } else {
            Write-Host "Tag $tag does not exist"
            exit 0
          }

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with: 
      version: ${{ github.event.inputs.version }}
    permissions:
      id-token: write
      attestations: write

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./artifact

      - name: Prepare release notes 
        run: | 
          $notes = "${{ github.event.inputs.notes }}" -replace "\\n","`n" 
          Set-Content -Path RELEASE_NOTES.md -Value $notes

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.prerelease }}
          files: artifact/*
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
